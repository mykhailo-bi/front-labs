<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Cart #{{ cart.id }} - details</title>
</head>
<body>
    <h1>Cart #{{ cart.id }}</h1>

    <p><strong>User ID:</strong> {{ cart.user_id }}</p>
    <p><strong>Product ID:</strong> {{ cart.product_id }}</p>
    <p><strong>Count:</strong> {{ cart.count }}</p>
    <p><strong>Created at:</strong> {{ cart.created_at }}</p>
    <p><strong>Updated at:</strong> {{ cart.updated_at }}</p>

    <p>
        <a href="{% url 'lab5_app:cart_list' %}">Back to carts</a>
    </p>

    <h2>Delete cart</h2>
    <form method="post" action="{% url 'lab5_app:cart_delete' id=cart.id %}">
        {% csrf_token %}
        <button type="submit">Delete cart</button>
    </form>
</body>
</html>
