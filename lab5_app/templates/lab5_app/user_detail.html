<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>User #{{ user.id }} - details</title>
</head>
<body>
    <h1>User #{{ user.id }}</h1>
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>First name:</strong> {{ user.firstname }}</p>
    <p><strong>Last name:</strong> {{ user.lastname }}</p>

    <p>
        <a href="{% url 'lab5_app:user_list' %}">Back to users</a> |
        <a href="{% url 'lab5_app:user_detail' id=user.id %}">Refresh</a>
    </p>

    <h2>Delete user</h2>
    <form method="post" action="{% url 'lab5_app:user_delete' id=user.id %}">
        {% csrf_token %}
        <button type="submit">Delete user</button>
    </form>
</body>
</html>
