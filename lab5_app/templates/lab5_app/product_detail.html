<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Product #{{ product.id }} - details</title>
</head>
<body>
    <h1>Product #{{ product.id }}</h1>
    <p><strong>Name:</strong> {{ product.name }}</p>
    <p><strong>Description:</strong> {{ product.description }}</p>
    <p><strong>Price:</strong> {{ product.price }}</p>

    <p>
        <a href="{% url 'lab5_app:product_list' %}">Back to products</a> |
        <a href="{% url 'lab5_app:product_detail' id=product.id %}">Refresh</a>
    </p>

    <h2>Delete product</h2>
    <form method="post" action="{% url 'lab5_app:product_delete' id=product.id %}">
        {% csrf_token %}
        <button type="submit">Delete product</button>
    </form>
</body>
</html>
