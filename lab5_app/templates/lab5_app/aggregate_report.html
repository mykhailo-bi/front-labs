<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Aggregate Report</title>
</head>
<body>
    <h1>Aggregated Report</h1>
    <table>
        <tr><th>Metric</th><th>Value</th></tr>
        <tr><td>Total users</td><td>{{ report.total_users }}</td></tr>
        <tr><td>Total products</td><td>{{ report.total_products }}</td></tr>
        <tr><td>Total orders</td><td>{{ report.total_orders }}</td></tr>
        <tr><td>Total cart items</td><td>{{ report.total_cart_items }}</td></tr>
        <tr><td>Average product price</td><td>{{ report.average_product_price }}</td></tr>
        <tr><td>Revenue</td><td>{{ report.revenue }}</td></tr>
    </table>
    <p><a href="{% url 'lab5_app:product_list' %}">Back to products</a></p>
</body>
</html>
