<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Orders - list</title>
</head>
<body>
    <h1>Orders</h1>
    <p><a href="{% url 'lab5_app:order_list' %}">Refresh</a> | <a href="{% url 'lab5_app:product_list' %}">Products</a></p>

    <ul>
    {% for order in orders %}
        <li>
            <a href="{% url 'lab5_app:order_detail' id=order.id %}">Order #{{ order.id }} - User {{ order.user_id }} - {{ order.created_at }}</a>
        </li>
    {% empty %}
        <li>No orders.</li>
    {% endfor %}
    </ul>
</body>
</html>
