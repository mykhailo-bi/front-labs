<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>OrderContent #{{ item.id }} - details</title>
</head>
<body>
    <h1>OrderContent #{{ item.id }}</h1>
    <p><strong>Order ID:</strong> {{ item.order_id }}</p>
    <p><strong>Product ID:</strong> {{ item.product_id }}</p>
    <p><strong>Count:</strong> {{ item.count }}</p>

    <p>
        <a href="{% url 'lab5_app:ordercontent_list' %}">Back to list</a>
    </p>

    <h2>Delete order content</h2>
    <form method="post" action="{% url 'lab5_app:ordercontent_delete' id=item.id %}">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>
</body>
</html>
