<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Delete User #{{ user.id }}</title>
</head>
<body>
    <h1>Delete User #{{ user.id }}</h1>
    <p>Are you sure you want to delete user "{{ user.username }}"?</p>

    <form method="post" action="{% url 'lab5_app:user_delete' id=user.id %}">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'lab5_app:user_detail' id=user.id %}">Cancel</a>
    </form>
</body>
</html>
