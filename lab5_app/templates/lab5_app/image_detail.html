<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Image #{{ image.id }} - details</title>
</head>
<body>
    <h1>Image #{{ image.id }}</h1>
    <p><strong>URL:</strong> {{ image.url }}</p>

    <p>
        <a href="{% url 'lab5_app:image_list' %}">Back to images</a>
    </p>

    <h2>Delete image</h2>
    <form method="post" action="{% url 'lab5_app:image_delete' id=image.id %}">
        {% csrf_token %}
        <button type="submit">Delete image</button>
    </form>
</body>
</html>
