<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>{% if is_edit %}Edit{% else %}Add{% endif %} Review</title>
</head>
<body>
    <h1>{% if is_edit %}Edit{% else %}Add{% endif %} Review</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>

    <p><a href="{% url 'lab5_app:review_list' %}">Back to list</a></p>
    {% if is_edit %}
        <p><a href="{% url 'lab5_app:review_detail' id=review.id %}">Cancel</a></p>
    {% endif %}
</body>
</html>
