<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>{% if student %}Student #{{ student.student_id }} - details{% else %}Student - not found{% endif %}</title>
</head>
<body>
    {% if student %}
        <h1>Student #{{ student.student_id }}</h1>
        <p><strong>Name:</strong> {{ student.first_name }} {{ student.last_name }}</p>
        <p><strong>Email:</strong> {{ student.email }}</p>
        <p><strong>Phone:</strong> {{ student.phone }}</p>

        <p>
            <a href="{% url 'lab5_app2:student_list' %}">Back to students</a> |
            <a href="{% url 'lab5_app2:student_detail' id=student.student_id %}">Refresh</a> |
            <a href="{% url 'lab5_app2:student_edit' id=student.student_id %}">Edit</a>
        </p>

        <h2>Delete student</h2>
        <form method="post" action="{% url 'lab5_app2:student_delete' id=student.student_id %}">
            {% csrf_token %}
            <button type="submit">Delete student</button>
        </form>
    {% else %}
        <h1>Student not found</h1>
        <p><a href="{% url 'lab5_app2:student_list' %}">Back to students</a></p>
    {% endif %}
</body>
</html>
