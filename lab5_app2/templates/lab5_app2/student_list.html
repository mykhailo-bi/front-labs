<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Students - list</title>
</head>
<body>
    <h1>Students</h1>
    <p>
        <a href="{% url 'lab5_app2:student_create' %}">Create a Student</a>
    </p>

    <ul>
    {% for student in students %}
        <li>
            <a href="{% url 'lab5_app2:student_detail' id=student.student_id %}">
                {{ student.student_id }} - {{ student.first_name }} {{ student.last_name }} ({{ student.email }})
            </a>
            <form method="post" action="{% url 'lab5_app2:student_delete' id=student.student_id %}" style="display:inline">
                {% csrf_token %}
                <button type="submit">Delete</button>
            </form>
        </li>
    {% empty %}
        <li>No students.</li>
    {% endfor %}
    </ul>
</body>
</html>
