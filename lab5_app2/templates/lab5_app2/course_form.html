<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>{% if editing %}Edit Course{% else %}Create Course{% endif %}</title>
</head>
<body>
    <h1>{% if editing %}Edit Course{% else %}Create Course{% endif %}</h1>
    {% if editing and data.course_id %}
        <p><em>Editing course #{{ data.course_id }}</em></p>
    {% endif %}

    {% if errors %}
        <div style="color:red">
            <strong>Errors:</strong>
            <pre>{{ errors }}</pre>
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label>Course name:<br>
                <input type="text" name="course_name" value="{{ data.course_name|default:'' }}">
            </label>
        </p>
        <p>
            <label>Description:<br>
                <textarea name="description">{{ data.description|default:'' }}</textarea>
            </label>
        </p>
        <p>
            <label>Duration (hours):<br>
                <input type="number" name="duration" value="{{ data.duration|default:'' }}">
            </label>
        </p>
        <p>
            <label>Price:<br>
                <input type="text" name="price" value="{{ data.price|default:'' }}">
            </label>
        </p>

        <p>
            <button type="submit">{% if editing %}Save changes{% else %}Create{% endif %}</button>
            <a href="{% url 'lab5_app2:course_list' %}">Cancel</a>
        </p>
    </form>
</body>
</html>
