<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Delete Course #{{ course.course_id }}</title>
</head>
<body>
    <h1>Delete Course</h1>
    <p>Are you sure you want to delete course #{{ course.course_id }} - {{ course.name }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm delete</button>
        <a href="{% url 'lab5_app2:course_detail' id=course.course_id %}">Cancel</a>
    </form>
</body>
</html>
